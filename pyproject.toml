[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[project]
name = "check-mate"
version = "0.1.0"
description = "Monitoring and recovery helpers for exascale checkpoint/restart workflows"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Huihuo Zheng", email = "huihuo.zheng@anl.gov" },
  { name = "Sam Foreman", email = "foremans@anl.gov" },
]
license = { file = "LICENSE" }
keywords = ["hpc", "checkpoint", "monitoring", "exascale"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/argonne-lcf/checkpoint_restart"
Documentation = "https://example.com/check-mate"
Source = "https://github.com/argonne-lcf/checkpoint_restart"

[project.scripts]
check-mate = "check_mate.cli:main"
check-mate-hang = "check_mate.check_hang:main"
check-mate-nan = "check_mate.check_nan:main"

[project.optional-dependencies]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9.5",
]
dev = [
    "pytest>=7.4",
    "pre-commit>=3.6",
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
    "pyright>=1.1.406",
]

[tool.ruff]
line-length = 80
extend-exclude = ["docs"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
omit = ["tests/*"]
